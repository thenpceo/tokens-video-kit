      render3d();

      /* ===================================================================
         CHART draw (Scene 2)
      =================================================================== */
      var line = document.getElementById("chartLine");
      var fill = document.getElementById("chartFill");
      var dot = document.getElementById("chartDot");
      var LEN = line.getTotalLength();
      line.style.strokeDasharray = LEN; line.style.strokeDashoffset = LEN;
      var draw = { p: 0 };
      function renderChart() {
        var p = draw.p;
        line.style.strokeDashoffset = LEN * (1 - p);
        var pt = line.getPointAtLength(Math.max(0.001, LEN * p));
        dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y);
        dot.style.opacity = p >= 0.999 ? 0 : 1;
      }
      gsap.set(fill, { opacity: 0 }); renderChart();

      /* ===================================================================
         TIMELINE  (S1 0–2.8 · S2 2.7–6.4 · push 5.8 · S3 6.1–8.6 · S4 8.2–13.9)
      =================================================================== */
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* SCENE 1 */
      tl.to(view, { spin: 0.25, duration: 2.8, ease: "none", onUpdate: render3d }, 0);
      tl.fromTo(view, { entry: 1 }, { entry: 0, duration: 1.3, ease: "power3.out", onUpdate: render3d }, 0);
      tl.from(canvas, { opacity: 0, duration: 0.55, ease: "power2.out" }, 0);
      tl.from(s1l1, { x: 90, opacity: 0, duration: 0.4, ease: "power3.out", stagger: 0.035 }, 0.15);
      tl.from(s1l2, { x: 70, opacity: 0, duration: 0.38, ease: "power2.out", stagger: 0.02 }, 0.5);
      tl.to([].concat(s1l1, s1l2), { x: -1100, opacity: 0, filter: "blur(7px)", duration: 0.45, ease: "power2.in", stagger: 0.01 }, 2.0);
      tl.to(view, { exit: 1, duration: 0.6, ease: "power3.in", onUpdate: render3d }, 2.05);
      tl.to(canvas, { opacity: 0, duration: 0.45, ease: "power2.in" }, 2.2);
      tl.set(canvas, { opacity: 0 }, 2.7);
      tl.set([].concat(s1l1, s1l2), { opacity: 0 }, 2.8);

      /* SCENE 2 */
      tl.fromTo(".s2-stage", { scale: 1.22, x: -60, y: 70 }, { scale: 1, x: 0, y: 0, duration: 1.4, ease: "power3.out" }, 2.8);
      tl.to(draw, { p: 1, duration: 1.4, ease: "power3.out", onUpdate: renderChart }, 2.8);
      tl.to(fill, { opacity: 1, duration: 0.6, ease: "power2.out" }, 3.85);
      tl.from("#s2num", { scale: 0.7, opacity: 0, transformOrigin: "50% 50%", duration: 0.4, ease: "back.out(1.6)" }, 3.45);
      tl.to(count, { v: STAT_TARGET, duration: 1.35, ease: "power2.out", onUpdate: renderCount }, 3.5);
      // "Tokenized Equities Volume" + triangle: animate in, centered, nudged 5px right.
      // (offset is baked into the tween so a Studio drag won't re-break it)
      tl.fromTo("#s2vol", { y: 26, opacity: 0, x: 5 }, { y: 0, opacity: 1, x: 5, duration: 0.45, ease: "power2.out" }, 4.7);

      /* PUSH transition S2 -> S4 (mint seam leads) */
      tl.to(".s2", { yPercent: -100, duration: 0.55, ease: "power3.inOut" }, 5.8);
      tl.fromTo(".s4", { yPercent: 100 }, { yPercent: 0, duration: 0.55, ease: "power3.inOut" }, 5.8);
      tl.to(".seam", { opacity: 0, duration: 0.3, ease: "power1.out" }, 6.37);

      /* SCENE 4 (outro) */
      tl.from("#mark", { rotation: -1080, scale: 0.35, opacity: 0, transformOrigin: "50% 50%", duration: 1.4, ease: "power3.out" }, 6.05);
      tl.fromTo("#wordmark",
        { clipPath: "inset(0 100% 0 0)", webkitClipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", webkitClipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "steps(11)" }, 7.45);
      tl.from("#wordmark", { opacity: 0, duration: 0.12 }, 7.45);
      tl.fromTo("#glint", { x: -130 }, { x: 210, duration: 0.8, ease: "power1.inOut" }, 9.2);
      tl.to(".s4-lockup", { opacity: 0, duration: 0.6, ease: "power2.in" }, 10.7);

      /* POST FX — impact punch + chromatic RGB shift on the two cuts */
      tl.to("#s2num", { scale: 1.06, duration: 0.09, ease: "power2.out", yoyo: true, repeat: 1 }, 4.78);
      var ab = { v: 0 };
      function setAb() {
        var r = document.getElementById("abR"), b = document.getElementById("abB");
        if (r) r.setAttribute("dx", -ab.v);
        if (b) b.setAttribute("dx", ab.v);
      }
      tl.set(".s1", { filter: "url(#rgbShift)" }, 1.95);
      tl.to(ab, { v: 9, duration: 0.25, ease: "power2.in", onUpdate: setAb }, 1.98);
      tl.to(ab, { v: 0, duration: 0.3, ease: "power2.out", onUpdate: setAb }, 2.25);
      tl.set(".s1", { filter: "none" }, 2.78);
      tl.set([".s2", ".s4"], { filter: "url(#rgbShift)" }, 5.7);
      tl.to(ab, { v: 12, duration: 0.28, ease: "power2.in", onUpdate: setAb }, 5.72);
      tl.to(ab, { v: 0, duration: 0.34, ease: "power2.out", onUpdate: setAb }, 6.02);
      tl.set([".s2", ".s4"], { filter: "none" }, 6.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
